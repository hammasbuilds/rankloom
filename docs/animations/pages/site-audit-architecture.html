<script type="application/json" id="spec">{"id": "site-audit-architecture", "repo": "rankloom", "project": "Site Audit · Page Check", "title": "Page Check, layer by layer", "subtitle": "Every function between the address and the score, with what it holds", "accent": "#4338ca", "input": {"label": "an address", "text": "amherstdental.com"}, "output": {"label": "Page Check", "text": "91/100 · 18 pass · 2 warn · 1 fail"}, "intro_text": "The same run, opened up: the code that runs at each stop and what the packet carries there.", "summary": "normalise → session/CSRF/rate → DNS pinned to a public IP → one bounded fetch → parse → 21 weighted checks → 91/100 → a typed view drawn as text.", "facts": "site_audit.py · netguard.py · common.py", "footer": "github.com/hammasbuilds/rankloom (private)", "insets": true, "nodes": [{"id": "form", "label": "Page Check", "sub": "one address", "role": "ui", "icon": "🖥", "kind": "block", "x": 0.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "api", "label": "Run API", "sub": "session · CSRF · 30 runs/10 min", "role": "api", "icon": "🔐", "kind": "block", "x": 4.6, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "guard", "label": "Address guard", "sub": "public IP · ports 80/443", "role": "guard", "icon": "🛡", "kind": "gate", "x": 9.2, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "site", "label": "The website", "sub": "fetched once, max 3 MB", "role": "ext", "icon": "🌐", "kind": "block", "x": 13.799999999999999, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.0}, {"id": "parse", "label": "Parser", "sub": "title · H1s · JSON-LD · text", "role": "core", "icon": "🧩", "kind": "block", "x": 13.799999999999999, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.6}, {"id": "checks", "label": "21 checks", "sub": "status · weight · fix", "role": "core", "icon": "✅", "kind": "block", "x": 9.2, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.8}, {"id": "score", "label": "Score", "sub": "pass 1 · warn ½ · fail 0", "role": "data", "icon": "📊", "kind": "block", "x": 4.6, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "view", "label": "Result view", "sub": "checks, worst first", "role": "ui", "icon": "📄", "kind": "block", "x": 0.0, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}], "edges": [{"from": "form", "to": "api"}, {"from": "api", "to": "guard"}, {"from": "guard", "to": "site"}, {"from": "site", "to": "parse"}, {"from": "parse", "to": "checks"}, {"from": "checks", "to": "score"}, {"from": "score", "to": "view"}], "steps": [{"node": "form", "via": [], "packet": "amherstdental.com", "role": "ui", "title": "The address is normalised", "text": "A bare host gets https:// and a trailing slash, so the same page is never audited twice under two spellings.", "travel": 0.01, "data": "site_audit.normalise_url", "inset": {"kind": "code", "title": "rankloom/engines/site_audit.py", "lines": ["def normalise_url(url):", "    url = url.strip()", "    if '://' not in url: url = 'https://' + url", "# -> https://amherstdental.com/"], "note": "Abridged from the file - open it to read the full function."}}, {"node": "api", "via": ["form>api"], "packet": "POST /api/tools/…/run", "role": "api", "title": "Session, header, origin, rate", "text": "The handler reads the body first, then refuses anything without the custom header and a matching Origin. Runs are limited to 30 per 10 minutes per user.", "data": "server.Handler.run_tool", "inset": {"kind": "code", "title": "rankloom/server.py", "lines": ["if self.headers.get('X-Rankloom') != '1': 403", "if origin and origin != base: 403", "if self.app.limited('run-user', uid): 429", "LIMITS['run-user'] = (30, 600)"], "note": "Abridged from the file - open it to read the full function."}}, {"node": "guard", "via": ["api>guard"], "packet": "public IP : 443", "role": "guard", "title": "DNS answer checked, then pinned", "text": "The host is resolved and every address must be public - no 10.x, 127.x or 169.254.x. The connection then goes to that checked IP, so a second DNS answer cannot swap in a private one.", "data": "netguard.resolve_public", "inset": {"kind": "code", "title": "rankloom/netguard.py", "lines": ["ALLOWED_PORTS = {80, 443}", "if port not in ALLOWED_PORTS: raise FetchRefused", "ip = resolve_public(host)    # every A/AAAA public", "sock = create_connection((ip, port))  # pinned"], "note": "Abridged from the file - open it to read the full function."}}, {"node": "site", "via": ["guard>site"], "packet": "HTTP 200 · 3,349 ms", "role": "ext", "title": "One bounded fetch", "text": "max_bytes 3,000,000, timeout 15 s, max_redirects 5, each hop re-checked by the guard. Compressed bodies are decoded; Brotli is detected by a headers-only probe.", "data": "netguard.safe_fetch", "inset": {"kind": "bars", "title": "Fetch budget used", "rows": [{"label": "response time (ms)", "value": 3349, "tag": "of 15,000"}, {"label": "redirects", "value": 1, "tag": "of 5"}], "note": "Speed is measured from this server, so it is quoted with that caveat."}}, {"node": "parse", "via": ["site>parse"], "packet": "title: 129 chars", "role": "core", "title": "The page, as tokens of meaning", "text": "parse_page walks the HTML once. The title alone is 129 characters - six search phrases joined by five bars.", "data": "site_audit.parse_page", "inset": {"kind": "tokens", "title": "Title, split as written", "items": ["Dentist", "Williamsville,", "NY", "|", "Dentist", "Near", "Me", "|", "Local", "Dentist", "|", "Dentist", "Office", "Near", "Me", "|", "Cost", "of", "Dental", "Care", "|", "Amherst", "Dental", "Group"], "note": "129 characters; Google shows about 60."}}, {"node": "checks", "via": ["parse>checks"], "packet": "21 × status", "role": "core", "title": "Each check is a fact with a weight", "text": "Every check returns pass, warn or fail, the evidence it read and the fix. None is a guess: a missing tag is missing.", "data": "site_audit.audit", "inset": {"kind": "bars", "title": "Today's checks on this page", "rows": [{"label": "pass", "value": 18, "color": "#16a34a"}, {"label": "warn", "value": 2, "color": "#f59e0b"}, {"label": "fail", "value": 1, "color": "#ef4444"}], "note": ""}}, {"node": "score", "via": ["checks>score"], "packet": "91", "role": "data", "title": "Weighted, not counted", "text": "A heavy check (HTTPS, indexing) moves the score more than a light one (Open Graph tags). A warning earns half its weight.", "data": "common.score_checks", "inset": {"kind": "code", "title": "rankloom/engines/common.py", "lines": ["CREDIT = {PASS: 1.0, WARN: 0.5, FAIL: 0.0}", "total = sum(c['weight'] for c in items)", "got = sum(c['weight'] * CREDIT[c['status']] ...)", "return round(100 * got / total)   # 91"], "note": "Abridged from the file - open it to read the full function."}}, {"node": "view", "via": ["score>view"], "packet": "blocks: facts, checks", "role": "ui", "title": "One view schema for every tool", "text": "The engine returns a headline and typed blocks; the page draws them with textContent only, so nothing the website said can run as code here.", "data": "common.view · static/app.js", "inset": {"kind": "code", "title": "output view", "lines": ["headline: {title, subtitle, score: 91,", "           counts: {pass:18, warn:2, fail:1}}", "blocks: [facts 'What the page says',", "         checks 'Checks' (worst first)]"], "note": "Abridged from the file - open it to read the full function."}}], "post": "What happens inside a one-page SEO audit, from address to score.\n\nInput: amherstdental.com. Output: 91/100 - 18 checks pass, 2 warn, 1 fails.\n\n1. The server checks the session and the request's origin.\n2. An address guard allows public addresses on ports 80/443 only, re-checking every redirect.\n3. One fetch (3 MB cap, 15 s): it answered in 3,349 ms.\n4. The parser reads the title, headings, JSON-LD and 1,697 words of text.\n5. 21 checks run; pass earns full weight, a warning half.\n6. The failure comes first - with the note that speed was measured from our server, not the visitor's.\n\nPart of Rankloom, a private workspace for selling SEO and AI-visibility work.\n#SEO #WebPerformance #Python"}</script>
