[project]
name = "rankloom"
version = "0.1.0"
description = "One workspace of growth tools: site audits, AI visibility, keywords, trends, leads, outreach, content, social and launch kits."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Muhammad Hammas" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S310", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "E501"]
"scripts/*" = ["E501", "S603", "S607"]
