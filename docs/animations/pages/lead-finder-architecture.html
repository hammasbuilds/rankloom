<script type="application/json" id="spec">{"id": "lead-finder-architecture", "repo": "rankloom", "project": "Lead Finder", "title": "From a map to an honest first message", "subtitle": "Public map data, chain detection, quick audits and drafts that quote only facts", "accent": "#b45309", "input": {"label": "trade, city, country", "text": "dentist · Manchester · gb"}, "output": {"label": "Lead Finder", "text": "49 leads · 13 audited · drafts"}, "intro_text": "Find businesses, check their sites, rank them, and write a message that says only what is true.", "summary": "49 dentists from OpenStreetMap, 13 sites audited in 77 s, ranked, saved per branch, drafts quoting only real findings.", "facts": "49 found · 13 audited · 77 s", "footer": "github.com/hammasbuilds/rankloom (private)", "insets": true, "nodes": [{"id": "form", "label": "Business Search", "sub": "trade · city · country", "role": "ui", "icon": "🔎", "kind": "block", "x": 0.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "osm", "label": "OpenStreetMap", "sub": "Nominatim · 1 req/s", "role": "ext", "icon": "🗺", "kind": "block", "x": 4.6, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "chain", "label": "Chain check", "sub": "brand tags · sister branches", "role": "guard", "icon": "🔗", "kind": "gate", "x": 9.2, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "audit", "label": "Quick audits", "sub": "25 sites, 4 at once", "role": "core", "icon": "⚡", "kind": "block", "x": 13.799999999999999, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.6}, {"id": "rank", "label": "Opportunity", "sub": "0-100, most to gain", "role": "data", "icon": "📈", "kind": "block", "x": 13.799999999999999, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "save", "label": "Lead List", "sub": "one row per branch", "role": "store", "icon": "💾", "kind": "cyl", "x": 9.2, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "draft", "label": "Outreach drafts", "sub": "only what was found", "role": "ui", "icon": "✉", "kind": "block", "x": 4.6, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}], "edges": [{"from": "form", "to": "osm"}, {"from": "osm", "to": "chain"}, {"from": "chain", "to": "audit"}, {"from": "audit", "to": "rank"}, {"from": "rank", "to": "save"}, {"from": "save", "to": "draft"}], "steps": [{"node": "form", "via": [], "packet": "dentist · Manchester · gb", "role": "ui", "title": "A trade in a city", "text": "Dentists in Manchester, UK. The country keeps 'Manchester' from meaning New Hampshire.", "travel": 0.01, "data": "leads.run_search"}, {"node": "osm", "via": ["form>osm"], "packet": "49 businesses", "role": "ext", "title": "Public map data", "text": "OpenStreetMap's Nominatim, one request a second as its policy asks, names in English. 49 dentists; 13 list a website.", "data": "sources.places", "inset": {"kind": "bars", "title": "What the map gave", "rows": [{"label": "businesses", "value": 49}, {"label": "with a website", "value": 13}], "note": ""}}, {"node": "chain", "via": ["osm>chain"], "packet": "brand → site", "role": "guard", "title": "Not listed ≠ no website", "text": "A branch with no website of its own is checked against its brand tag and its sister branches, so a chain is never told it has no site.", "data": "leads.search", "inset": {"kind": "code", "title": "rankloom/engines/leads.py", "lines": ["for b in found:", "  b['chain_site'] = b.get('brand_website')", "     or sites_by_name.get(b['name'].lower())", "# chain branch -> opportunity 15, not 50"], "note": "Abridged from the file - open it to read the full function."}}, {"node": "audit", "via": ["chain>audit"], "packet": "13 audited in 77 s", "role": "core", "title": "Each website checked once", "text": "The same page checks, quoting only facts read from the page. A bot-check page or a timeout is 'could not check', never quoted to them.", "data": "leads.quick_audit"}, {"node": "rank", "via": ["audit>rank"], "packet": "50 · 45 · 0-80", "role": "data", "title": "Who has the most to gain", "text": "A checked weak site ranks high; 'no website listed' ranks 50, to confirm; a site that did not answer 45; a chain branch 15.", "data": "leads.opportunity"}, {"node": "save", "via": ["rank>save"], "packet": "49 rows", "role": "store", "title": "Saved, branch by branch", "text": "Branches with no website stay separate leads (keyed by address); branches sharing one site are one lead.", "data": "leads.save_lead"}, {"node": "draft", "via": ["save>draft"], "packet": "2 things noticed", "role": "ui", "title": "A message that stays true", "text": "For ICE Hospital: 'the search description is too short or too long… the home page has more than one main heading.' No claim the check did not make.", "data": "leads.write_drafts"}], "post": "Lead generation without lying to the lead.\n\nInput: dentist, Manchester, UK. Output: 49 ranked leads and honest first messages.\n\nOpenStreetMap (1 request/second) → 49 businesses, 13 with a website → each site checked once → ranked by what they stand to gain.\nA chain branch is matched to its brand's site instead of being told 'you have no website'. A site that didn't answer is never quoted.\nDrafts quote only what the check found.\n#LeadGeneration #Sales"}</script>
