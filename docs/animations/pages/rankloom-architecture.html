<script type="application/json" id="spec">{"id": "rankloom-architecture", "repo": "rankloom", "project": "The whole product", "title": "Rankloom, end to end", "subtitle": "Seven tools behind one page, one API, one address guard", "accent": "#4338ca", "input": {"label": "a sub-tool form", "text": "any of 18 sub-tools"}, "output": {"label": "Rankloom", "text": "a typed result view, saved to the dashboard"}, "intro_text": "The architecture every tool shares: browser, accounts, API, engines, guard, web, storage.", "summary": "One page app, scrypt accounts with 2-step, a forgery-proof API, 18 engines with one output contract, a guarded fetcher, SQLite per user, and a read-only link to Job Radar.", "facts": "7 tools · 18 sub-tools · 173 tests", "footer": "github.com/hammasbuilds/rankloom (private)", "insets": false, "nodes": [{"id": "browser", "label": "Browser", "sub": "one page app · CSP", "role": "ui", "icon": "🖥", "kind": "block", "x": 0.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "auth", "label": "Accounts", "sub": "scrypt · 2-step · sessions", "role": "guard", "icon": "🔐", "kind": "gate", "x": 4.6, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "api", "label": "HTTP API", "sub": "stdlib server", "role": "api", "icon": "🔌", "kind": "block", "x": 9.2, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "engines", "label": "7 tools · 18 sub-tools", "sub": "one view schema", "role": "core", "icon": "🧰", "kind": "block", "x": 13.799999999999999, "y": 0.0, "w": 2.3, "d": 2.3, "h": 2.0}, {"id": "guard", "label": "Address guard", "sub": "public IPs, 80/443", "role": "guard", "icon": "🛡", "kind": "gate", "x": 13.799999999999999, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "web", "label": "Public web", "sub": "sites · autocomplete · OSM", "role": "ext", "icon": "🌐", "kind": "block", "x": 9.2, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "db", "label": "SQLite", "sub": "runs · leads · clients", "role": "store", "icon": "💾", "kind": "cyl", "x": 4.6, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "radar", "label": "Job Radar", "sub": "read-only link", "role": "store", "icon": "📡", "kind": "cyl", "x": 0.0, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}], "edges": [{"from": "browser", "to": "auth"}, {"from": "auth", "to": "api"}, {"from": "api", "to": "engines"}, {"from": "engines", "to": "guard"}, {"from": "guard", "to": "web"}, {"from": "web", "to": "db"}, {"from": "db", "to": "radar"}], "steps": [{"node": "browser", "via": [], "packet": "a sub-tool form", "role": "ui", "title": "One page, every tool", "text": "The sidebar lists seven tools; every tool and sub-tool opens in its own window. User data is only ever drawn with textContent.", "travel": 0.01, "data": "static/app.js"}, {"node": "auth", "via": ["browser>auth"], "packet": "session cookie", "role": "guard", "title": "Who is this?", "text": "Passwords hashed with scrypt; sessions are 256-bit tokens stored as SHA-256; 2-step codes cannot be replayed; new recovery codes need a fresh code.", "data": "security.py · server.py"}, {"node": "api", "via": ["auth>api"], "packet": "POST /run", "role": "api", "title": "A request nobody can forge", "text": "Custom header plus matching Origin on every change; sign-in, 2-step, runs and password re-checks are rate limited.", "data": "server.Handler"}, {"node": "engines", "via": ["api>engines"], "packet": "engine(fields, ctx)", "role": "core", "title": "Seven tools, one contract", "text": "Each sub-tool returns a headline and typed blocks - facts, checks, tables, lists, drafts - so one renderer draws them all.", "data": "engines/common.py"}, {"node": "guard", "via": ["engines>guard"], "packet": "check, pin, fetch", "role": "guard", "title": "Every request out, guarded", "text": "A typed address can only reach the public web, on standard ports, re-checked per redirect.", "data": "netguard.safe_fetch"}, {"node": "web", "via": ["guard>web"], "packet": "pages · searches · places", "role": "ext", "title": "Public data only", "text": "Websites, search
