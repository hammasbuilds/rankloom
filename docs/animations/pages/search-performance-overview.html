<script type="application/json" id="spec">{"id": "search-performance-overview", "repo": "rankloom", "project": "Search Performance", "title": "Search Console, as a work list", "subtitle": "The input, every part it passes, the output - from a real run", "accent": "#2563eb", "input": {"label": "a Search Console export", "text": "amherst-gsc-compare.zip"}, "output": {"label": "Search Performance", "text": "7 near page one · −45 clicks explained"}, "intro_text": "An export goes in. Watch it become one consistent total and a list ordered by clicks to win.", "summary": "20 queries and 11 pages read, 1,287 clicks from one table, 7 striking-distance queries, the 80-click loss traced to one query.", "facts": "20 queries · 11 pages · 28 days", "footer": "github.com/hammasbuilds/rankloom (private)", "insets": false, "nodes": [{"id": "form", "label": "Import", "sub": "Search Console zip", "role": "ui", "icon": "📦", "kind": "block", "x": 0.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "parse", "label": "CSV reader", "sub": "Queries · Pages · Filters", "role": "core", "icon": "🧾", "kind": "block", "x": 4.6, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "totals", "label": "One total", "sub": "from the Pages table", "role": "data", "icon": "Σ", "kind": "block", "x": 9.2, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "store", "label": "Dataset", "sub": "per user, sealed off", "role": "store", "icon": "💾", "kind": "cyl", "x": 13.799999999999999, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "opps", "label": "Opportunities", "sub": "8-20 · low CTR · unclicked", "role": "core", "icon": "🎯", "kind": "block", "x": 13.799999999999999, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.6}, {"id": "changes", "label": "Changes", "sub": "this period vs last", "role": "core", "icon": "↕", "kind": "block", "x": 9.2, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.6}, {"id": "view", "label": "What to work on", "sub": "with clicks to win", "role": "ui", "icon": "📄", "kind": "block", "x": 4.6, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}], "edges": [{"from": "form", "to": "parse"}, {"from": "parse", "to": "totals"}, {"from": "totals", "to": "store"}, {"from": "store", "to": "opps"}, {"from": "opps", "to": "changes"}, {"from": "changes", "to": "view"}], "steps": [{"node": "form", "via": [], "packet": "amherst-gsc-compare.zip", "role": "ui", "title": "A Search Console export", "text": "The zip Search Console gives you, with a comparison period. Nothing is fetched from Google.", "travel": 0.01, "data": "search_perf.run_import", "dur": 3.0}, {"node": "parse", "via": ["form>parse"], "packet": "20 queries · 11 pages", "role": "core", "title": "Read as the export is written", "text": "Queries.csv, Pages.csv and Filters.csv; a byte-order mark and either period order are handled. The date range comes from Filters.csv.", "data": "search_perf.parse_upload", "dur": 3.0}, {"node": "totals", "via": ["parse>totals"], "packet": "1,287 clicks", "role": "data", "title": "One number everywhere", "text": "Totals come from the Pages table in the import, the changes view and the client report alike, and the page says which table.", "data": "search_perf.site_rows", "dur": 3.0}, {"node": "store", "via": ["totals>store"], "packet": "dataset #1", "role": "store", "title": "Kept per user", "text": "Each upload is scoped to the account that imported it.", "data": "server.import", "dur": 3.0}, {"node": "opps", "via": ["store>opps"], "packet": "7 near page one", "role": "core", "title": "Where the next clicks are", "text": "Position 8-20 with real impressions; CTR below what the position usually earns; seen but never clicked. 'dentist williamsville ny' at 4.2: 2.5% vs 8% typical, about 132 clicks to win.", "data": "search_perf.opportunities", "dur": 3.0}, {"node": "changes", "via": ["opps>changes"], "packet": "1,332 → 1,287", "role": "core", "title": "What moved, and where", "text": "Clicks fell 45. 'dentist williamsville ny' lost 80 (position 2.8 → 4.2); the emergency page gained (15.9 → 11.0). A query new this period says 'new', not '0.0 →'.", "data": "search_perf.changes", "dur": 3.0}, {"node": "view", "via": ["changes>view"], "packet": "fix list", "role": "ui", "title": "A short list with numbers", "text": "Each row says how many clicks are at stake, so the work is ordered by value.", "data": "search_perf.run_opportunities", "dur": 3.0}], "post": "Search Console data, turned into a work list with the clicks at stake.\n\nInput: a Search Console export (28 days vs previous). Output: 7 near-page-one queries, 3 under-clicked, the losers and gainers.\n\nOne total everywhere (1,287 clicks, from the Pages table). 'dentist williamsville ny' at position 4.2 gets 2.5% CTR where 8% is typical: ~132 clicks a period to win. Clicks 1,332 → 1,287, mostly that query slipping from 2.8 to 4.2.\n#SEO #GoogleSearchConsole"}</script>
