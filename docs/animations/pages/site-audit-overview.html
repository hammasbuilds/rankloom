<script type="application/json" id="spec">{"id": "site-audit-overview", "repo": "rankloom", "project": "Site Audit · Page Check", "title": "Inside a one-page SEO audit", "subtitle": "From one address to a weighted score - recorded from a real run", "accent": "#4338ca", "input": {"label": "an address", "text": "amherstdental.com"}, "output": {"label": "Page Check", "text": "91/100 · 18 pass · 2 warn · 1 fail"}, "intro_text": "Type an address. Watch it pass the guard, get fetched once, parsed, checked 21 ways and scored.", "summary": "One guarded fetch, a parse, 21 checks and a weighted score: 91/100, with the slow response first and its caveat attached.", "facts": "21 checks · 3,349 ms · 1,697 words", "footer": "github.com/hammasbuilds/rankloom (private)", "insets": false, "nodes": [{"id": "form", "label": "Page Check", "sub": "one address", "role": "ui", "icon": "🖥", "kind": "block", "x": 0.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "api", "label": "Run API", "sub": "session · CSRF · 30 runs/10 min", "role": "api", "icon": "🔐", "kind": "block", "x": 4.6, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "guard", "label": "Address guard", "sub": "public IP · ports 80/443", "role": "guard", "icon": "🛡", "kind": "gate", "x": 9.2, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "site", "label": "The website", "sub": "fetched once, max 3 MB", "role": "ext", "icon": "🌐", "kind": "block", "x": 13.799999999999999, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.0}, {"id": "parse", "label": "Parser", "sub": "title · H1s · JSON-LD · text", "role": "core", "icon": "🧩", "kind": "block", "x": 13.799999999999999, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.6}, {"id": "checks", "label": "21 checks", "sub": "status · weight · fix", "role": "core", "icon": "✅", "kind": "block", "x": 9.2, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.8}, {"id": "score", "label": "Score", "sub": "pass 1 · warn ½ · fail 0", "role": "data", "icon": "📊", "kind": "block", "x": 4.6, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "view", "label": "Result view", "sub": "checks, worst first", "role": "ui", "icon": "📄", "kind": "block", "x": 0.0, "y": 4.4, "w": 2.3, "d": 2.3, "h": 1.3}], "edges": [{"from": "form", "to": "api"}, {"from": "api", "to": "guard"}, {"from": "guard", "to": "site"}, {"from": "site", "to": "parse"}, {"from": "parse", "to": "checks"}, {"from": "checks", "to": "score"}, {"from": "score", "to": "view"}], "steps": [{"node": "form", "via": [], "packet": "amherstdental.com", "role": "ui", "title": "An address goes in", "text": "A dentist's home page in Williamsville, NY. No account on their side, no plugin: just the public page.", "travel": 0.01}, {"node": "api", "via": ["form>api"], "packet": "POST /run", "role": "api", "title": "The server checks who is asking", "text": "The run needs a signed-in session, the X-Rankloom header and a matching Origin, so another site cannot start one."}, {"node": "guard", "via": ["api>guard"], "packet": "public? 80/443?", "role": "guard", "title": "The address is checked before any request", "text": "Only public addresses on the standard web ports. Every redirect is checked again, and the socket connects to the address that was checked."}, {"node": "site", "via": ["guard>site"], "packet": "200 in 3,349 ms", "role": "ext", "title": "The page is fetched", "text": "One request, up to 3 MB and 15 seconds, at most 5 redirects. It answered 200 in 3,349 ms - timed from this server."}, {"node": "parse", "via": ["site>parse"], "packet": "1,697 words", "role": "core", "title": "The HTML is read", "text": "Title, description, headings, canonical, Open Graph, JSON-LD and the visible text are pulled out of the markup."}, {"node": "checks", "via": ["parse>checks"], "packet": "18 ✓ 2 ! 1 ✗", "role": "core", "title": "21 checks run", "text": "Each check is a fact from the page: HTTPS, title length, indexing, viewport, schema, alt text, speed and the rest."}, {"node": "score", "via": ["checks>score"], "packet": "91 / 100", "role": "data", "title": "One score, weighted", "text": "Pass earns its full weight, a warning half, a failure none. 91 out of 100."}, {"node": "view", "via": ["score>view"], "packet": "fix list", "role": "ui", "title": "The fixes, worst first", "text": "The failure first: a 3.3 s response, with the caveat that it was measured from this server. Then the 129-character title."}], "post": "What happens inside a one-page SEO audit, from address to score.\n\nInput: amherstdental.com. Output: 91/100 - 18 checks pass, 2 warn, 1 fails.\n\n1. The server checks the session and the request's origin.\n2. An address guard allows public addresses on ports 80/443 only, re-checking every redirect.\n3. One fetch (3 MB cap, 15 s): it answered in 3,349 ms.\n4. The parser reads the title, headings, JSON-LD and 1,697 words of text.\n5. 21 checks run; pass earns full weight, a warning half.\n6. The failure comes first - with the note that speed was measured from our server, not the visitor's.\n\nPart of Rankloom, a private workspace for selling SEO and AI-visibility work.\n#SEO #WebPerformance #Python"}</script>
